server:
  port: ${PORT:5000}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rasoi_sutra}
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# JWT Configurations
rasoisutra:
  app:
    jwtSecret: ${JWT_SECRET:RasoiSutraSuperSecretJWTKey2026!RasoiSutraSuperSecretJWTKey2026!}
    jwtExpirationMs: ${JWT_EXPIRATION:86400000}

# Razorpay Configuration
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_defaultKeyId}
    secret: ${RAZORPAY_KEY_SECRET:defaultKeySecret}

# Cloudinary Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:ezfi6qwa}
  api-key: ${CLOUDINARY_API_KEY:145736831222146}
  api-secret: ${CLOUDINARY_API_SECRET:iswo5_QylaPaNC_kRdotTZ2Z1yc}

# Logging Configuration
logging:
  level:
    org:
      springframework:
        web: INFO
    com:
      rasoisutra:
        ecom: DEBUG
